<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'JetBrains Mono', ui-monospace, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="rgba(255,255,255,.35)" />
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="518" rx="18" fill="#0A0A0A" stroke="rgba(255,255,255,.09)" />

  <text x="450" y="52" text-anchor="middle" font-size="26" font-weight="700" letter-spacing=".2">
    <tspan fill="#ffffff">How </tspan><tspan fill="#00FFB2">VoxelPort</tspan><tspan fill="#ffffff"> Connects Your Server</tspan>
  </text>
  <text x="450" y="76" text-anchor="middle" font-size="12.5" fill="#8a8a8a" letter-spacing=".2">
    Device token is generated automatically on first launch — no signup, no manual registration step.
  </text>

  <!-- HOST -->
  <rect x="388" y="104" width="124" height="54" rx="11" fill="rgba(176,132,245,.10)" stroke="#B084F5" stroke-width="1.4" />
  <text x="450" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#B084F5" letter-spacing=".5">HOST</text>
  <text x="450" y="144" text-anchor="middle" font-size="9.5" fill="#8a8a8a" letter-spacing=".3">app · mod · server</text>

  <!-- HOST -> RELAY -->
  <line x1="450" y1="158" x2="450" y2="222" stroke="rgba(255,255,255,.28)" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="466" y="194" font-size="10.5" fill="#9a9a9a">opens outbound WSS,</text>
  <text x="466" y="207" font-size="10.5" fill="#9a9a9a">sends device token</text>

  <!-- RELAY -->
  <rect x="384" y="226" width="132" height="62" rx="12" fill="rgba(0,255,178,.10)" stroke="#00FFB2" stroke-width="1.8" />
  <text x="450" y="253" text-anchor="middle" font-size="17" font-weight="700" fill="#00FFB2" letter-spacing=".5">RELAY</text>
  <text x="450" y="270" text-anchor="middle" font-size="10" fill="#8a8a8a" letter-spacing=".3">play.voxelport.in</text>

  <!-- RELAY -> players (fan out) -->
  <line x1="450" y1="288" x2="180" y2="392" stroke="rgba(255,255,255,.28)" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="450" y1="288" x2="450" y2="392" stroke="rgba(255,255,255,.28)" stroke-width="1.4" marker-end="url(#arrow)" />
  <line x1="450" y1="288" x2="720" y2="392" stroke="rgba(255,255,255,.28)" stroke-width="1.4" marker-end="url(#arrow)" />
  <text x="450" y="322" text-anchor="middle" font-size="10.5" fill="#9a9a9a">assigns a public TCP port · bridges traffic</text>

  <!-- Players -->
  <g>
    <rect x="110" y="396" width="140" height="56" rx="11" fill="rgba(255,79,163,.08)" stroke="#FF4FA3" stroke-width="1.3" />
    <text x="180" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FF4FA3" letter-spacing=".4">PLAYER</text>
    <text x="180" y="437" text-anchor="middle" font-size="9" fill="#8a8a8a">vanilla client</text>
  </g>
  <g>
    <rect x="380" y="396" width="140" height="56" rx="11" fill="rgba(255,216,74,.08)" stroke="#FFD84A" stroke-width="1.3" />
    <text x="450" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD84A" letter-spacing=".4">PLAYER</text>
    <text x="450" y="437" text-anchor="middle" font-size="9" fill="#8a8a8a">vanilla client</text>
  </g>
  <g>
    <rect x="650" y="396" width="140" height="56" rx="11" fill="rgba(79,216,255,.08)" stroke="#4FD8FF" stroke-width="1.3" />
    <text x="720" y="420" text-anchor="middle" font-size="13" font-weight="700" fill="#4FD8FF" letter-spacing=".4">PLAYER</text>
    <text x="720" y="437" text-anchor="middle" font-size="9" fill="#8a8a8a">vanilla client</text>
  </g>

  <text x="450" y="492" text-anchor="middle" font-size="12" fill="#8a8a8a" letter-spacing=".4">
    vanilla minecraft · no mods required to join · your home IP is never exposed
  </text>
</svg>
