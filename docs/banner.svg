<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="VoxelPort Fabric Mod: open your Minecraft world to friends, no port forwarding">
  <defs><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="3" height="3" x="12" y="12" fill="#E8DCC5"/></pattern></defs>
  <rect width="1280" height="400" fill="#F3EBDC"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect x="6" y="6" width="1268" height="388" fill="none" stroke="#15120F" stroke-width="6"/>

  <g>
    <rect x="86" y="92" width="224" height="224" fill="#15120F" transform="translate(10 10)"/>
    <image href="data:image/png;base64," x="86" y="92" width="224" height="224" style="image-rendering:pixelated"/>
  </g>

  <text x="352" y="196" font-family="Bangers, Impact, 'Arial Black', system-ui, sans-serif" font-size="132" letter-spacing="2" fill="#FFFBF2" stroke="#15120F" stroke-width="12" stroke-linejoin="round" paint-order="stroke">VoxelPort</text>
  <text x="356" y="252" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="34" fill="#15120F">Fabric mod for Minecraft 26.1 – 26.3</text>
  <text x="356" y="294" font-family="'Courier Prime', 'Courier New', ui-monospace, monospace" font-size="24" fill="#3A332B">Open your world to friends in one click.</text>

  <g transform="rotate(-2 472 344)">
    <rect x="361" y="327" width="232" height="44" fill="#15120F"/>
    <rect x="356" y="322" width="232" height="44" fill="#F6CB2F" stroke="#15120F" stroke-width="3"/>
    <text x="472" y="351" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="19" fill="#15120F">NO PORT FORWARDING</text>
  </g>
  <g transform="rotate(1.5 692 344)">
    <rect x="617" y="327" width="160" height="44" fill="#15120F"/>
    <rect x="612" y="322" width="160" height="44" fill="#43C8D8" stroke="#15120F" stroke-width="3"/>
    <text x="692" y="351" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="19" fill="#15120F">NO ACCOUNT</text>
  </g>
  <g transform="rotate(-1.5 922 344)">
    <rect x="801" y="327" width="252" height="44" fill="#15120F"/>
    <rect x="796" y="322" width="252" height="44" fill="#5FAE3B" stroke="#15120F" stroke-width="3"/>
    <text x="922" y="351" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="19" fill="#15120F">INDIA + EUROPE RELAYS</text>
  </g>

  <g transform="rotate(8 1130 120)">
    <rect x="1043" y="73" width="170" height="86" fill="#15120F"/>
    <rect x="1036" y="66" width="170" height="86" fill="#C8262B" stroke="#15120F" stroke-width="4"/>
    <text x="1121" y="104" text-anchor="middle" font-family="Bangers, Impact, 'Arial Black', system-ui, sans-serif" font-size="30" fill="#FFFBF2" letter-spacing="1">FREE &amp;</text>
    <text x="1121" y="138" text-anchor="middle" font-family="Bangers, Impact, 'Arial Black', system-ui, sans-serif" font-size="30" fill="#FFFBF2" letter-spacing="1">OPEN SOURCE</text>
  </g>
</svg>
